version: "3.8"

services:
  aria-backend:
    build: .
    # Backend port not exposed externally by default — accessible only via nginx proxy
    # Uncomment below to expose for development/debugging:
    # ports:
    #   - "9000:9000"
    expose:
      - "9000"
    volumes:
      - cache-data:/app/.devops_pro_cache
      - ./config:/app/config:ro
    environment:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  aria-frontend:
    image: nginx:alpine
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend-v2/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aria-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cache-data:
