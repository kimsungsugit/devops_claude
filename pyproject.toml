[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# scripts 를 포함해야 **훅 스크립트가 커버리지 게이트에 보인다**.
# 예전엔 빠져 있어서 훅이 0% 여도 fail_under 게이트가 초록이었다 — 정작 그 훅들이
# 품질 게이트 본체(quality_check/posttool_dispatch)라 fake-green 의 메타 버전이었다.
# oneoff/ 는 일회성 진단 스크립트라 제외.
source = ["report_gen", "generators", "workflow", "backend", "scripts"]
omit = ["tests/*", "*/migrations/*", "*/__pycache__/*", "scripts/oneoff/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` 의 미사용 import 는 **패키지 공개 API 재export** 다 — 결함이 아니다.
# ruff 도 이 자리엔 자동수정을 주지 않는다(제안만 한다). 이 저장소는 이미 일부
# 파일에 `# noqa: F401` 을 손으로 달아 같은 의도를 표시해 왔다(backend/helpers 등).
# 규칙을 파일 단위로 끄는 게 관행이자 정확한 표현이다 — 실측 132건이 전부 이 형태.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "workflow", "report_gen", "generators"]
