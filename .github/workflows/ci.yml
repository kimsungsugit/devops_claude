name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax of changed Python files
        run: |
          CHANGED_PY=$(git diff --name-only HEAD~1..HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED_PY" ]; then
            echo "Checking: $CHANGED_PY"
            FAIL=0
            for f in $CHANGED_PY; do
              [ -f "$f" ] && python -m py_compile "$f" || FAIL=1
            done
            [ $FAIL -ne 0 ] && exit 1
            echo "All syntax checks passed"
          else
            echo "No Python files changed"
          fi

  unit-tests:
    name: Unit Tests
    # ⚠ **windows 러너여야 한다.** 이 저장소는 Windows 전제가 코드·테스트 곳곳에 박혀 있다
    #   (SwUT 입력 어댑터의 `C:\...` 경로, Cloudium prefix/UNC 판정, 훅 인터프리터 계약).
    #   ubuntu 에서는 그 전제가 성립하지 않아 33건이 실패했고, 그 상태가 2026-06 부터
    #   한 달 넘게 방치됐다(6/20 main 로그의 실패 테스트가 지금과 동일). 로컬 Windows
    #   전체 회귀는 4,603 passed 라 코드 결함이 아니라 **러너 OS 불일치**였다.
    #   skipif 로 넘기면 CI 가 그 33건을 영영 안 보게 되므로 러너를 맞춘다.
    runs-on: windows-latest
    # ⚠ hang 상한. 이 저장소에서 "오래 걸림" 의 실체는 느림이 아니라 **hang** 이었다
    #   (chat_history_db 재진입 데드락 + test_admin_gate 의 tkinter 모달). 로컬 훅은
    #   900s+30s KILL 로 fail-closed 인데 여긴 상한이 없어 GitHub 기본값(최대 360분)에
    #   의존했다 — GitLab 은 `timeout: 15m` 을 명시하는데 여기만 비대칭이었다.
    #   xdist 미적용(직렬)이라 로컬 179초보다 넉넉히 잡되, 종일 도는 일은 없게 한다.
    timeout-minutes: 30
    needs: syntax-check
    # ⚠ windows 러너의 로캘은 영문(cp1252)이라 **한글 출력이 UnicodeEncodeError 로 죽는다.**
    #   개발 PC 는 한국어 로캘(cp949)이라 이 차이가 로컬에서는 안 보인다. 실측: 훅 계약
    #   테스트가 `quality_check.py --json` 을 서브프로세스로 띄우는데, 스크립트의 한글
    #   진단문이 인코딩되지 않아 stdout 이 통째로 비고 `json.loads('')` 로 6건이 깨졌다.
    #   UTF-8 모드는 서브프로세스에도 상속되므로 잡 전체에 건다.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠ windows 러너의 기본 셸은 pwsh 다 — `|| true`, 줄끝 `\` 는 bash 문법이므로
      #   셸을 명시하지 않으면 스크립트가 조용히 다르게 해석된다.
      - name: Install dependencies
        shell: bash
        run: |
          # ruff 는 `test_hook_env.TestProjectPy` 가 **해석된 인터프리터에 실제로 있는지**를
          # 검사하기 때문에 필요하다. CI 엔 `.venv/` 가 없어 project_py() 가 러너 Python 으로
          # 폴백하므로, 로컬 .venv 가 만족하는 계약을 CI 도 같은 방식으로 만족해야 한다
          # (테스트를 약화시키는 게 아니라 환경을 계약에 맞추는 것).
          pip install pytest pytest-cov ruff
          # ⚠ `|| true` 를 뗐다. 설치가 실패해도 조용히 넘어가면 그 뒤 테스트가
          #   module_missing 으로 죽었을 때 **원인이 설치 실패라는 신호가 이미 사라진 뒤**다.
          #   실패를 여기서 드러내되, 어떤 패키지가 문제인지 로그에 남긴다.
          if ! pip install -r requirements.txt; then
            echo "::error::requirements.txt 설치 실패 — 이후 테스트 결과는 신뢰할 수 없다"
            pip check || true
            exit 1
          fi

      - name: Run unit tests with coverage
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # `-rs` = **skip 사유를 로그에 이름과 함께 남긴다.** 없으면 요약이 "26 skipped" 뿐이라
          # 무엇이 검증되지 않았는지 알 길이 없다 — 실측: SwSA 빌더의 실데이터 테스트 25건이
          # `.codex_tmp/`(gitignore) 샘플 부재로 CI 에선 통째로 skip 되는데 초록불만 보였다.
          # 이 저장소의 anti-fake-green 계약(도구·데이터 부재를 clean 으로 읽지 않는다)과 같은 이유.
          #
          # ⚠ `--ignore=tests/unit/test_impact_jobs.py` 를 **제거**했다. CI 최초 도입 커밋
          #   (6066596)에 사유 없이 들어와 19건이 계속 미검증이었다. 지금 파일엔 CI 적대적
          #   요소가 없고(절대경로·네트워크·tkinter·subprocess 0건), windows·xdist·UTF-8
          #   조건에서 19 passed 를 확인했다. 다시 제외해야 한다면 **사유를 여기 적을 것**.
          #
          # ⚠ `tests/integration/` 을 **추가**했다(2026-08-21). 이 게이트가 `tests/unit/` 만
          #   돌아서, integration 56건이 커밋 1b6bb99(2026-08-04) 이후 **17일 동안 전부 401 로
          #   죽어 있었는데 아무도 몰랐다**. 거기엔 `STS-EXPORTS-001` 같은 ISO 26262 추적성
          #   ID 가 달려 "시험이 있다" 는 근거로 쓰인다. 되살린 뒤 74 passed.
          #   `tests/` 루트 직속 3파일(196건)은 아직 제외 — 사유는
          #   `tests/unit/test_gate_reach.py` 의 `_EXEMPT` 에 적혀 있다.
          python -m pytest tests/ -q -rs --tb=short \
            --cov=backend --cov=workflow --cov=report_gen --cov=generators --cov=scripts \
            --cov-report=term-missing --cov-report=html:htmlcov \
            --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Run Vitest
        working-directory: frontend-v2
        run: npm test

  lint:
    name: Lint (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # before-SHA 가 여러 커밋 뒤일 수 있어 전체 이력 필요

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # eslint ratchet 은 frontend-v2 의 **로컬** eslint 바이너리를 직접 부른다
      # (npx 레지스트리 즉석 다운로드 의존 제거 — _hook_env.project_eslint).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint tools
        run: pip install ruff pyyaml

      # ruff·frontmatter 게이트를 Claude Code 훅 밖(CI)에서도 강제. ruff 는
      # **변경 라인만**(ruff_ratchet) — 저장소 backlog 1072건에 CI 가 익사하지
      # 않도록. frontmatter 는 backlog 가 없어 그대로 전량 검사.
      - name: Ruff ratchet + SKILL.md frontmatter (changed only)
        env:
          # push 는 이 push 의 **모든 커밋**(before..after), PR 은 base 기준.
          # HEAD~1..HEAD 만 보면 멀티커밋 push 의 이전 커밋 위반을 놓친다(이 게이트가
          # 방어하려는 훅 우회 경로가 정확히 멀티커밋 push 다).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 빈/zero SHA(새 브랜치 첫 push)나 도달 불가면 HEAD~1 로 폴백.
          # 폴백이 항상 유효한 base 를 보장 → 빈 range 로 인한 fail-open 차단.
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "diff base = $BASE"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)
          # ⚠ `--name-only` 는 **삭제된 파일도 낸다.** 없는 파일은 lint 대상이 될 수 없고,
          #   frontmatter 검사기는 읽기 실패로 죽는다 — 실측: 이 브랜치가 `.agents/skills`
          #   18개를 지웠더니 FileNotFoundError 18건으로 CI 가 통째로 실패했다.
          #   위 syntax-check 스텝은 `[ -f "$f" ]` 로 이미 막고 있었다. 같은 가드가 한쪽에만
          #   있어 생긴 결함이라, 세 리스트가 갈리지 않게 **여기 한 곳**에서 거른다.
          CHANGED=$(for f in $CHANGED; do [ -f "$f" ] && echo "$f"; done)
          CHANGED_PY=$(echo "$CHANGED" | grep '\.py$' || true)
          CHANGED_SKILL=$(echo "$CHANGED" | grep 'SKILL\.md$' || true)
          # 확장자는 eslint.config.js 범위(js,jsx)와 일치. node_modules 배제는 유지 —
          # tracked 였던 2,186개는 추적 해제됐지만 다시 add 되면 커맨드라인이 폭주한다.
          CHANGED_JS=$(echo "$CHANGED" | grep -E 'frontend-v2/.*\.(js|jsx)$' | grep -v '/node_modules/' || true)
          RC=0
          if [ -n "$CHANGED_PY" ]; then
            echo "Ruff ratchet on changed .py"
            python scripts/ruff_ratchet.py --base "$BASE" $CHANGED_PY || RC=$?
          else
            echo "No changed .py"
          fi
          if [ -n "$CHANGED_JS" ]; then
            # ruff 와 동일한 ratchet. rc=2(DISABLED)도 그대로 전파해 **빌드 실패** —
            # CI 는 통제된 환경이라 도구 부재는 인프라 이상이지 통과가 아니다.
            # npm ci 는 여기서만 — JS 변경이 없는 커밋(대다수)에 60초를 낭비하지 않는다.
            echo "ESLint ratchet on changed JS/JSX"
            (cd frontend-v2 && npm ci)
            python scripts/eslint_ratchet.py --base "$BASE" $CHANGED_JS || RC=$?
          else
            echo "No changed frontend-v2 JS/JSX"
          fi
          if [ -n "$CHANGED_SKILL" ]; then
            echo "Frontmatter on changed SKILL.md"
            python scripts/check_skill_frontmatter.py $CHANGED_SKILL || RC=1
          fi
          # 하네스 문서 **본문**의 코드 참조 실재 검사. frontmatter 검사기는 구조만 보므로
          # "없는 함수 사용법"·"무관한 줄번호"·"허구인 에이전트 문서" 가 사각이었다.
          CHANGED_DOC=$(echo "$CHANGED" | grep -E '^(\.claude/.*\.md|CLAUDE\.md)$' || true)
          if [ -n "$CHANGED_DOC" ]; then
            echo "Doc references on changed harness docs"
            python scripts/check_doc_references.py --base "$BASE" $CHANGED_DOC || RC=$?
          fi
          exit $RC
